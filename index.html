    // ============ PROJEMİZ İÇERİĞİ ============
    const projectContent = `
        <div class="hero-card">
            <div class="report-button-container">

                    <span class="report-button-icon">📄</span> Proje Raporu

            <div class="section-title">🚀 BALBAY-M3090: Yönetici Özeti ve Teknik Spesifikasyonlar</div>
            <div class="subsection-title">1. YÖNETİCİ ÖZETİ</div>
            <p>BALBAY-M3090, Alçak Dünya Yörüngesi'ndeki (LEO) uzay çöplerini etkisiz hâle getirmek amacıyla tasarlanmış, maliyet etkin ve sürdürülebilir bir operasyon uydusudur. Geleneksel ağır radar sistemleri yerine, yeryüzü istasyonları ve yerleşik akıllı optik sensörlerin hibrit kullanımıyla ağırlığı 165 kg bandında tutulmuştur. "Sıfır Atık" prensibiyle çalışan Nitinol-Kevlar ağ sistemi sayesinde tek bir görevde onlarca uzay çöpünü temizleme kapasitesine sahiptir.</p>
            
            <div class="subsection-title">2. TEKNİK SPESİFİKASYONLAR VE BİLEŞENLER</div>
            <div class="subsubsection-title">2.1. Gövde ve Radyasyon Zırhı</div>
            <ul style="margin: 15px 0 15px 30px; line-height:1.6;">
                <li><strong>Malzeme:</strong> Karbon fiber takviyeli polimer (CFRP) ve epoksi bağlayıcılar.</li>
                <li><strong>Zırh:</strong> Yüksek yoğunluklu polietilen (HDPE) çekirdek. Bu yapı, nötron radyasyonunu sönümlerken uydunun yapısal bütünlüğünü korur.</li>
                <li><strong>Koruma:</strong> Atomik oksijen korozyonuna karşı Al₂O₃ ve SiO₂ nano kaplamalar.</li>
            </ul>
            
            <div class="subsubsection-title">2.2. Avcı Sensör Süiti (Gözler ve Beyin)</div>
            <ul style="margin: 15px 0 15px 30px; line-height:1.6;">
                <li><strong>Yer yüzündeki radarlar:</strong> Radyo dalgalarını kullanarak çöplerin yer tespiti.</li>
                <li><strong>Stereo Kameralar:</strong> 4 adet yüksek çözünürlüklü kamera ile 360° derinlik algısı.</li>
                <li><strong>Mikro-LiDAR:</strong> Yakın mesafe (0–500 m) için santimetre hassasiyetinde mesafe ve hız ölçümü.</li>
                <li><strong>Yapay Zekâ Birimi:</strong> Görüntü işleme tabanlı otonom kilitlenme ve takla hızı analiz yazılımı.</li>
                <li><strong>Aydınlatma:</strong> Karanlık bölgelerde operasyon için yüksek güçlü LED matrisler.</li>
            </ul>
            
            <div class="subsubsection-title">2.3. İtki ve Manevra Sistemi</div>

                <li><strong>Ana Yakıt:</strong> 35 kg kompozit titanyum tank içerisinde ksenon gazı.</li>
                <li><strong>İyon Motoru:</strong> Uzun süreli yörünge transferleri için yüksek verimli ana itki sistemi.</li>
                <li><strong>Resistojet İticiler:</strong> Ani manevra ve ağ fırlatma basıncı için elektrikle ısıtılan ksenon püskürtme sistemi.</li>
                <li><strong>Yönlendirme:</strong> 4 adet yüksek devirli reaksiyon tekerleği (yakıtsız hassas konumlandırma).</li>
            </ul>
            
            <div class="subsection-title">3. OPERASYONEL MEKANİZMALAR</div>
            <div class="subsubsection-title">3.1. Hibrit Ağ ve Büzüşme Sistemi</div>
            <ul style="margin: 15px 0 15px 30px; line-height:1.6;">
                <li><strong>Malzeme:</strong> Kevlar 49 (kesilme direnci) ve Nitinol (şekil hafızalı alaşım).</li>
                <li><strong>Çalışma Prensibi:</strong> Ağ fırlatıldıktan sonra çöpü sardığında, Nitinol tellere düşük voltajlı elektrik verilir. Isınan tel, saniyenin altında bir sürede orijinal büzülmüş formuna geri döner ve çöpü paketler.</li>
                <li><strong>Geri Dönüşüm:</strong> Büzüşen Nitinol tellere bir kez daha elektrik verilir, büzüşen teller eski haline döner ve filemiz uyduya makara çarklarımızla geri çekilir. Çöplerde atmosfere yanmak üzere gönderilir (revolver şarjör sistemi).</li>
            </ul>

            <ul style="margin: 15px 0 15px 30px; line-height:1.6;">
                <li><strong>Malzeme:</strong> Alüminize Kapton film ve karbon fiber kollar.</li>
                <li><strong>İşlev:</strong> Yakıt harcamadan atmosfere giriş hızını artırır. Pasif yavaşlama sağlayarak görev ömrünü 10 yıla kadar uzatır.</li>

                <tr><td>Donanım</td><td>Sensörler, motorlar, gövde ve yakıt</td><td>$1,120,000</td></tr>

            <div class="subsection-title">5. RİSK ANALİZİ VE DOĞRULUK PAYI</div>
            <ul style="margin: 15px 0 15px 30px; line-height:1.6;">
                <li><strong>Hedef Tespit Hassasiyeti:</strong> Yer radarı, stereo kamera ve LiDAR füzyonu ile %99,997 konum doğruluğu.</li>
                <li><strong>Teknik Risk:</strong> Karanlık bölgelerde optik körlük riski, yüksek güçlü LED aydınlatma ve LiDAR ile telafi edilmiştir.</li>
            </ul>
            
            <div class="subsection-title">6. SONUÇ VE VİZYON</div>
            <p>BALBAY-M3090, Türkiye'nin uzaydaki stratejik varlıklarını korumayı hedefleyen ve aynı zamanda küresel "uzay temizliği" alanında düşük maliyetli ve sürdürülebilir bir çözüm sunan yenilikçi bir sistemdir. Projenin bir sonraki aşaması, yer testleri için bir "Mühendislik Modeli" (EM) geliştirilmesidir.</p>
            
            <div class="subsection-title">7. HUKUKİ UYUM VE DÜZENLEYİCİ ÇERÇEVE</div>
            <p>GÖK-SEYMEN projesi, başta Outer Space Treaty olmak üzere uluslararası uzay hukuku çerçevesine uygun şekilde tasarlanmıştır. Uzaydaki her nesnenin mülkiyet hakkı fırlatan devlete ait olduğundan, hedeflenen uzay çöplerine müdahale öncesinde ilgili ülkelerden gerekli izinler alınacaktır.</p>

            <p>Bu yaklaşım sayesinde BALBAY-M3090, küresel uzay sürdürülebilirliği hedefleriyle uyumlu, güvenilir ve uluslararası iş birliklerine açık bir çözüm sunmaktadır.</p>
            
            <div class="team-list">
                <strong>📝 Hazırlayanlar:</strong><br>
                <div class="team-names">
                    Mustafa Balaban<br>
                    Mustafa Değer<br>
                    Yiğit Yılmaz<br>
                    Yusuf Enes Kılıç<br>
                    Ahmet Ulubaş
                </div>

            currentPage = pageName;
            updateActiveButton(pageName);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function updateActiveButton(activePage) {
        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.classList.remove("active");
            if (btn.getAttribute("data-page") === activePage) {
                btn.classList.add("active");
            }
        });
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            e.preventDefault();
            const page = btn.getAttribute("data-page");
            renderPage(page);
        });
    });

    function rastgeleYildizOlustur() {
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            star.style.animationDuration = `${Math.random() * 2 + 1.5}s`;
            starsContainer.appendChild(star);
        }
    }

    window.addEventListener('load', () => {
        renderPage("home");
        rastgeleYildizOlustur();
    });
</script>
</body>
</html>
